[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bidsgate"
version = "0.3.0"
description = "Recovery gate for neuroimaging pipelines: inject known lesions or atrophy into real BIDS data, run any BIDS app, score what it recovered."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Cedric Conday"}]
keywords = ["BIDS", "neuroimaging", "validation", "synthetic", "ground truth", "MRI", "lesion", "atrophy"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "nibabel>=5", "pandas>=2"]

[project.optional-dependencies]
phantom = ["lesiontrack>=0.2.0"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/CedricConday/bidsgate"

[project.scripts]
bidsgate = "bidsgate.cli:main"

[tool.setuptools.packages.find]
include = ["bidsgate*"]

[tool.ruff]
line-length = 100
target-version = "py310"
